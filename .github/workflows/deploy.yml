name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker with runtime secrets
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
        run: |
          test -n "$TRAFIKLAB_API_KEY"
          test -n "$RESROBOT_API_KEY"

          secrets_file="$RUNNER_TEMP/llt-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          umask 077
          jq --null-input \
            --arg trafiklab "$TRAFIKLAB_API_KEY" \
            --arg resrobot "$RESROBOT_API_KEY" \
            '{
              TRAFIKLAB_API_KEY: $trafiklab,
              RESROBOT_API_KEY: $resrobot
            }' > "$secrets_file"

          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/llt-deployment.jsonl"
          pnpm exec wrangler deploy --secrets-file "$secrets_file" --message "Commit $GITHUB_SHA"
          version_id=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          test -n "$version_id"
          printf '## Production deployment\n\nCommit: `%s`\n\nWorker version: `%s`\n' "$GITHUB_SHA" "$version_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production MCP and providers
        id: production-check
        env:
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: pnpm verify:deployed
      - name: Record verification result
        if: always() && steps.deploy.outcome == 'success'
        env:
          CHECK_RESULT: ${{ steps.production-check.outcome }}
        run: |
          printf '\nProduction verification: **%s**\n' "$CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"
